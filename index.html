<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>学びのミカタ キッズ｜3〜6さいの知育アプリ</title>
<meta name="description" content="3〜6さいの、ちえ・かず・もじ・ABC・とけい。親子でいっしょに、見て考えて遊べる知育アプリ。">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3c3c3c;--mute:#8a8a8a;--line:#e5e5e5;--green:#58cc02;--green-d:#58a700;--red:#ff4b4b;--blue:#1cb0f6;--blue-d:#1899d6;--sun:#ffc800;--sun-d:#e5a500;
 --round:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;--kana:'UD デジタル 教科書体 NK-R','UD Digital Kyokasho NK-R','Klee One','M PLUS Rounded 1c',serif;--c:#58cc02;--cd:#58a700;--cl:#e9fbd9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{background:#fff;overscroll-behavior:none}
body{font-family:var(--round);font-weight:800;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.13em}
.app{max-width:620px;margin:0 auto;padding:0 16px 120px;min-height:100vh}
.scr{display:none}.scr.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
/* 上 */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--green);box-shadow:0 3px 0 var(--green-d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.top h1{font-size:19px;line-height:1.2}.top h1 small{display:block;font-size:11px;color:var(--mute)}
.tbtn{margin-left:auto;display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:5px 11px;font-size:16px}
.chip .ic{font-size:20px}
.trial{display:none;align-items:center;gap:8px;background:#fff4d6;border:2px solid #ffe1a1;color:#9a5b00;border-radius:14px;padding:7px 10px 7px 14px;margin-top:12px;font-size:13px}
.trial.on{display:flex}body:not(.navon) .trial{display:none!important}.trial button{margin-left:auto;background:var(--sun);border-radius:10px;padding:5px 12px;box-shadow:0 3px 0 var(--sun-d);font-size:12px}
/* 分野タブ */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
.cat{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:10px 2px 8px;text-align:center}
.cat .ci{width:46px;height:46px;margin:0 auto 4px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.cat b{display:block;font-size:14px;line-height:1.2}
.cat.on{background:var(--cl);border-color:var(--c)}
.cat:active,.node:active,.opt:active,.chip:active{transform:translateY(3px)}
.band{background:var(--c);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--cd);display:flex;align-items:center;gap:12px;margin:8px 0 0}
.band small{display:block;font-size:12px;opacity:.9}.band b{display:block;font-size:20px;line-height:1.3}
.band .go{margin-left:auto;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}
/* 道 */
.path{display:flex;flex-direction:column;align-items:center;padding:56px 0 10px;gap:16px}
.nrow{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x))}
.node{width:84px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;position:relative}
.node.todo{background:#e5e5e5;color:#b5b5b5;box-shadow:0 8px 0 #cecece}
.node.cur{background:var(--c);box-shadow:0 8px 0 var(--cd);outline:7px solid var(--cl);outline-offset:4px}
.node.done{background:var(--c);box-shadow:0 8px 0 var(--cd)}
.node.gold{background:var(--sun);box-shadow:0 8px 0 var(--sun-d)}
.node .ic{font-size:36px}
.bub{position:absolute;top:-48px;background:#fff;color:var(--c);border:2px solid var(--line);border-radius:12px;padding:5px 14px;font-size:15px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.bub::after{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.nst{display:flex;gap:2px;margin-top:12px;font-size:15px;color:#e5e5e5}.nst .on{color:var(--sun)}
.nt{font-size:13px;margin-top:2px;text-align:center}
.nmon{position:absolute;top:0;width:80px;height:80px}.nmon.l{right:110px}.nmon.r{left:110px}.nmon.dim{filter:grayscale(1) opacity(.3)}
/* 下ナビ */
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:none;justify-content:center;gap:4px;padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:40}
body.navon .bnav{display:flex}
.bnav button,.bnav a{flex:1;max-width:150px;border:2px solid transparent;border-radius:14px;padding:5px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute);text-decoration:none}
.bnav .bi{font-size:26px;color:#b5b5b5}.bnav .on{border-color:#84d8ff;background:#ddf4ff;color:var(--blue-d)}.bnav .on .bi{color:var(--blue)}
/* 問題 */
.qbar{display:flex;align-items:center;gap:12px;padding:16px 0 8px}
.xbtn{font-size:28px;color:#b5b5b5;display:flex}
.pbar{flex:1;height:18px;background:#e5e5e5;border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.say{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.saybtn{width:64px;height:64px;border-radius:20px;background:var(--blue);box-shadow:0 5px 0 var(--blue-d);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.saybtn.play{animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.qtxt{font-size:22px;line-height:1.45;padding:4px 2px}
.bigch{font-family:var(--kana);font-weight:600;font-size:110px;line-height:1.1}.bigch.en,.opt.kana.en{font-family:var(--round);font-weight:800}
.digi{font-family:var(--round);font-size:64px;background:#3c3c3c;color:#7dff6a;border-radius:16px;padding:6px 22px;letter-spacing:2px}
.stage{min-height:150px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:6px 0 12px;padding:10px;border-radius:22px;background:#f7f7f7}
.stage:empty{display:none}
.stage svg{display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{border:3px solid var(--line);border-bottom-width:6px;border-radius:22px;min-height:120px;display:flex;align-items:center;justify-content:center;padding:8px;background:#fff;font-size:56px;line-height:1}
.opt.kana{font-family:var(--kana);font-weight:600;font-size:72px}
.opt.num{font-size:64px}
.opt.txt{font-size:30px}
.opt svg{max-width:100%;height:auto}
.opt.ok{border-color:var(--green);background:#d7ffb8;animation:okp .45s cubic-bezier(.2,1.6,.4,1)}
.opt.ng{border-color:var(--red);background:#ffdfe0;animation:shake .45s}
@keyframes okp{40%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60}
.big span{font-size:220px;color:var(--green);opacity:0;line-height:1}
.big.show span{animation:bigok .9s ease-out}
@keyframes bigok{0%{opacity:0;transform:scale(.3)}30%{opacity:.95;transform:scale(1.05)}80%{opacity:.9}100%{opacity:0;transform:scale(1.1)}}
/* 結果 */
.res{text-align:center;padding:30px 0}
.res .mon{width:170px;height:170px;margin:0 auto;animation:okp .8s .2s backwards}
.res h2{font-size:30px;margin:10px 0 4px}
.bigst{display:flex;justify-content:center;gap:8px;font-size:60px;color:#e5e5e5;margin:6px 0}.bigst .on{color:var(--sun)}
.btn{display:block;width:100%;border-radius:20px;padding:16px;font-size:20px;text-align:center;margin-top:12px}
.btn.pri{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.btn.sub{border:2px solid var(--line);border-bottom-width:5px;color:var(--blue-d)}
/* あそびば */
.glist{display:grid;gap:12px;margin-top:12px}
.gcard{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px;text-align:left}
.gcard:active{transform:translateY(3px)}
.gi{width:62px;height:62px;border-radius:18px;background:var(--gc);box-shadow:0 4px 0 var(--gd);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gcard b{display:block;font-size:20px}.gcard small{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.ghead{flex:1;display:flex;align-items:center;gap:8px;font-size:18px}
.ghead .tgt{width:34px;height:34px;border-radius:50%}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mc{aspect-ratio:1;border-radius:18px;border:3px solid var(--line);border-bottom-width:6px;background:#fff;display:flex;align-items:center;justify-content:center;perspective:400px}
.mc .bk{width:100%;height:100%;border-radius:14px;background:repeating-linear-gradient(45deg,#1cb0f6 0 10px,#49c0f8 10px 20px)}
.mc.open .bk,.mc.got .bk{display:none}.mc svg{display:none}.mc.open svg,.mc.got svg{display:block}
.mc.got{border-color:var(--green);background:#d7ffb8}
.tch{position:relative;height:min(118vw,600px);margin-top:10px;background:#f7f7f7;border-radius:22px}
.tn{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tn.done{opacity:.15;pointer-events:none}.tn.ng{animation:shake .4s}
.sky{position:relative;height:min(130vw,640px);margin-top:10px;background:linear-gradient(#ddf4ff,#fff);border-radius:22px;overflow:hidden}
.bl{position:absolute;bottom:-120px;width:70px;height:96px;animation:rise linear forwards}
.bl.pop{animation:popb .25s forwards}
@keyframes rise{to{transform:translateY(calc(-1 * min(130vw,640px) - 140px))}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.mz{display:block;margin:10px auto 0;touch-action:none;background:#fff;border-radius:18px;border:3px solid var(--line)}
.gdone{text-align:center;padding:30px 0}.gdone h2{font-size:30px;margin:10px 0}
/* ずかん */
.zk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.zc{border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.zc.no{background:#f7f7f7;border-color:#efefef;color:#cfcfcf;font-size:28px}
.zc.shiny{background:#fff4d6;border-color:#ffd15c}
/* 保護者 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.on{display:flex}
.ovb{background:#fff;border-radius:22px;padding:22px;max-width:400px;width:100%;text-align:center;font-family:'BIZ UDPGothic',sans-serif}
.ovb h3{font-family:var(--round);font-size:19px;margin-bottom:6px}
.ovb p{font-size:13px;color:var(--mute);margin-bottom:12px;font-weight:700;line-height:1.7}
.gate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.gate button{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px;font-size:20px;font-family:var(--round)}
.btn.buy{background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);text-decoration:none;font-family:var(--round)}
.cf{position:fixed;top:-12px;width:10px;height:15px;border-radius:2px;z-index:130;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
@media(max-width:380px){.opt{min-height:100px}.opt.kana{font-size:60px}}
</style>
</head>
<body>
<div class="app">
 <div class="trial" id="trial"><span id="trialText"></span><button onclick="openGate()">おうちの方へ</button></div>

 <section class="scr" id="sHome">
  <div class="top"><div class="logo" data-ic="sprout"></div><h1><small>学びのミカタ 3〜6さい</small>キッズ</h1>
   <div class="tbtn"><button class="chip" onclick="toggleSnd()" id="sndBtn" aria-label="おと"></button><div class="chip"><span data-ic="star" style="color:var(--sun)"></span><span id="stars">0</span></div></div></div>
  <div class="cats" id="cats"></div>
  <div class="band" id="band"></div>
  <div class="path" id="path"></div>
 </section>

 <section class="scr" id="sQuiz">
  <div class="qbar"><button class="xbtn" onclick="go('sHome')" aria-label="やめる"><span data-ic="x"></span></button><div class="pbar"><i id="qBar"></i></div></div>
  <div class="say"><div class="qtxt" id="qTxt"></div></div>
  <div class="stage" id="stage"></div>
  <div class="opts" id="opts"></div>
 </section>

 <section class="scr" id="sResult"><div class="res" id="res"></div></section>

 <section class="scr" id="sGame">
  <div class="top"><div class="logo" style="background:#ff9600;box-shadow:0 3px 0 #d97000" data-ic="game"></div><h1><small>ちょっと ひといき</small>あそびば</h1></div>
  <div class="glist">
   <button class="gcard" onclick="startGame('memory')" style="--gc:#1cb0f6;--gd:#1899d6"><div class="gi" data-ic="cards"></div><div><b>えあわせ</b><small>おなじ えを 2まい さがそう</small></div></button>
   <button class="gcard" onclick="startGame('touch')" style="--gc:#58cc02;--gd:#58a700"><div class="gi" data-ic="num"></div><div><b>かずタッチ</b><small>1から じゅんばんに タッチ</small></div></button>
   <button class="gcard" onclick="startGame('balloon')" style="--gc:#ce82ff;--gd:#a568cc"><div class="gi" data-ic="balloon"></div><div><b>ふうせんわり</b><small>おなじ いろの ふうせんを わろう</small></div></button>
   <button class="gcard" onclick="startGame('maze')" style="--gc:#ff9600;--gd:#d97000"><div class="gi" data-ic="maze"></div><div><b>めいろ</b><small>なぞって ゴールまで いこう</small></div></button>
  </div>
 </section>

 <section class="scr" id="sPlay">
  <div class="qbar"><button class="xbtn" onclick="endGame();go('sGame')" aria-label="やめる"><span data-ic="x"></span></button><div class="ghead" id="gHead"></div></div>
  <div id="gBoard"></div>
 </section>

 <section class="scr" id="sZukan">
  <div class="top"><div class="logo" data-ic="paw"></div><h1><small>あつめた なかま</small>ずかん</h1></div>
  <div class="zk" id="zk"></div>
 </section>
</div>
<div class="big" id="big"><span data-ic="circle"></span></div>

<nav class="bnav" id="bnav">
 <button data-k="home" onclick="go('sHome')"><span class="bi" data-ic="home"></span>あそぶ</button>
 <button data-k="game" onclick="go('sGame')"><span class="bi" data-ic="game"></span>ゲーム</button>
 <button data-k="zukan" onclick="go('sZukan')"><span class="bi" data-ic="paw"></span>ずかん</button>
 <button onclick="openGate()"><span class="bi" data-ic="lock"></span>おうちの方へ</button>
</nav>

<div class="ov" id="ovGate"><div class="ovb">
 <h3>おうちの方へ</h3>
 <p id="gateMsg">お子さまの誤操作を防ぐため、かんたんな問題に答えてください。</p>
 <div style="font-size:26px;font-family:var(--round)" id="gateQ"></div>
 <div class="gate" id="gateOpts"></div>
 <button class="btn sub" onclick="closeOv('ovGate')">とじる</button>
 
</div></div>
<div class="ov" id="ovBuy"><div class="ovb">
 <h3 id="buyTtl">学びのミカタ キッズ</h3>
 <p>ちえ・かず・もじ・ABCととけいの全32ステージと、あそびばのゲームが使えます。<br>買い切り 980円（税込）。月額料金はかかりません。</p>
 <a class="btn buy" href="https://buy.stripe.com/00w5kw1oQ672eGw1DU5wI0f">購入する</a>
 <button class="btn sub" id="buyClose" onclick="closeOv('ovBuy')">とじる</button>
</div></div>

<script>
const APP_ID='kids';
function monSVG(u,shiny){
  const h=u.hue,c1=`hsl(${h},88%,${shiny?62:57}%)`,c2=`hsl(${h},95%,${shiny?82:76}%)`,c3=`hsl(${h},75%,30%)`,v=u.id%4;
  const body=[
    `<path d="M50 12 C80 12 90 40 88 62 C86 84 70 92 50 92 C30 92 14 84 12 62 C10 40 20 12 50 12Z" fill="${c1}"/>`,
    `<rect x="14" y="20" width="72" height="70" rx="26" fill="${c1}"/><path d="M26 22 L32 6 L40 22Z M60 22 L68 6 L74 22Z" fill="${c3}"/>`,
    `<path d="M50 8 L90 86 Q50 98 10 86Z" fill="${c1}" stroke="${c1}" stroke-width="10" stroke-linejoin="round"/>`,
    `<circle cx="50" cy="56" r="38" fill="${c1}"/><circle cx="22" cy="24" r="10" fill="${c1}"/><circle cx="78" cy="24" r="10" fill="${c1}"/><circle cx="22" cy="24" r="5" fill="${c2}"/><circle cx="78" cy="24" r="5" fill="${c2}"/>`][v];
  const eyes=u.id%3===0?`<circle cx="50" cy="50" r="13" fill="white"/><circle cx="52" cy="51" r="6" fill="#1c2b2a"/><circle cx="54" cy="48" r="2" fill="white"/>`
    :`<circle cx="38" cy="50" r="9" fill="white"/><circle cx="62" cy="50" r="9" fill="white"/><circle cx="39" cy="51" r="4.5" fill="#1c2b2a"/><circle cx="63" cy="51" r="4.5" fill="#1c2b2a"/><circle cx="40" cy="49" r="1.6" fill="white"/><circle cx="64" cy="49" r="1.6" fill="white"/>`;
  const mouth=u.id%2?`<path d="M40 68 Q50 78 60 68" stroke="#1c2b2a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M44 69 L46 74 L48 70Z" fill="white"/>`
    :`<path d="M42 68 Q50 74 58 68" stroke="#1c2b2a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const sym=['+','−','×','÷','%','=','<','√'][u.id%8];
  const sparkle=shiny?`<path d="M84 10 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3Z" fill="#fbbf24"/><path d="M14 74 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2Z" fill="#fbbf24"/>`:'';
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${body}<ellipse cx="50" cy="80" rx="18" ry="8" fill="${c2}"/>
<circle cx="28" cy="64" r="5" fill="${c2}" opacity=".9"/><circle cx="72" cy="64" r="5" fill="${c2}" opacity=".9"/>${eyes}${mouth}
${sparkle}</svg>`;
}

/* ===================== アイコン ===================== */
const IC={
 star:'<svg viewBox="0 0 24 24" class="ic"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="currentColor"/></svg>',
 sound:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>',
 mute:'<svg viewBox="0 0 24 24" class="ic"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
 play:'<svg viewBox="0 0 24 24" class="ic"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
